<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>카드서랍</title>
  
  <!-- iOS 홈 화면 앱처럼 보이게 하는 설정 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="카드서랍" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- ▼▼▼ 여기 두 값을 Supabase 프로젝트 값으로 바꿔주세요 (README.md 참고) ▼▼▼ -->
  <script>
      window.SUPABASE_URL = "https://kfbruxzvaiwfjjgfquig.supabase.co";
      window.SUPABASE_ANON_KEY = "sb_publishable_2OYSHjjMESsdqkdBEJLoqw_htMAtRpP";
  </script>
    <!-- ▲▲▲ -->

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body, #root { height: 100%; }
        body { background: #1c1917; }
      </style>
  </head>
  <body>
    <div id="root"></div>div>

    <script type="text/plain" id="app-source">
      const { useState, useEffect, useRef, useCallback } = React;

      // ---------- Supabase ----------
      const supabaseReady = window.SUPABASE_URL && window.SUPABASE_URL.startsWith("http");
      const sb = supabaseReady
        ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
        : null;

      async function loadCardsRemote() {
        const { data, error } = await sb.from("cards").select("*").order("created_at", { ascending: true });
        if (error) throw error;
        return data.map((row) => ({
          id: row.id,
          front: row.front,
          back: row.back,
          easiness: row.easiness,
          repetitions: row.repetitions,
          interval: row.interval,
          dueDate: row.due_date,
        }));
      }

      async function upsertCardRemote(card) {
        const { error } = await sb.from("cards").upsert({
          id: card.id,
          front: card.front,
          back: card.back,
          easiness: card.easiness,
          repetitions: card.repetitions,
          interval: card.interval,
          due_date: card.dueDate,
        });
        if (error) console.error(error);
      }

      async function deleteCardRemote(id) {
        const { error } = await sb.from("cards").delete().eq("id", id);
        if (error) console.error(error);
      }

      // ---------- SRS (SM-2 based) ----------
      const DEFAULT_CARD = () => ({ easiness: 2.5, repetitions: 0, interval: 0, dueDate: null });

      function isDue(card) {
        if (!card.dueDate) return true;
        return new Date(card.dueDate).getTime() <= Date.now();
      }

      function nextSchedule(card, rating) {
        let { easiness, repetitions, interval } = card;
        if (rating === "again") {
          repetitions = 0;
          interval = 1;
          easiness = Math.max(1.3, easiness - 0.2);
        } else {
          repetitions += 1;
          if (rating === "hard") {
            easiness = Math.max(1.3, easiness - 0.15);
            interval = repetitions === 1 ? 1 : Math.max(1, Math.round(interval * 1.2));
          } else if (rating === "good") {
            if (repetitions === 1) interval = 1;
            else if (repetitions === 2) interval = 6;
            else interval = Math.round(interval * easiness);
          } else if (rating === "easy") {
            easiness = easiness + 0.15;
            if (repetitions === 1) interval = 4;
            else interval = Math.round(Math.max(interval, 1) * easiness * 1.3);
          }
        }
        const due = new Date();
        due.setDate(due.getDate() + interval);
        due.setHours(0, 0, 0, 0);
        return { easiness, repetitions, interval, dueDate: due.toISOString() };
      }

      function previewDays(card, rating) {
        return nextSchedule(card, rating).interval;
      }

      // ---------- CSV 파싱: 한글해석, 영어문장 2열 ----------
      function parseCsvText(text) {
        const parsed = Papa.parse(text.trim(), { skipEmptyLines: true });
        const rows = parsed.data;
        if (!rows || rows.length === 0) return [];

        let startIdx = 0;
        let krIdx = -1;
        let enIdx = -1;

        const first = rows[0].map((c) => (c ?? "").toString().trim());
        const firstLooksHeader =
          first.some((c) => /[가-힣a-zA-Z]/.test(c)) && !first.every((c) => /^\d+$/.test(c));

        if (firstLooksHeader) {
          first.forEach((c, i) => {
            if (/한글|해석|korean|kr/i.test(c)) krIdx = i;
            if (/영어|english|sentence|en/i.test(c)) enIdx = i;
          });
          startIdx = 1;
        }

        if (krIdx === -1 || enIdx === -1) {
          krIdx = 0;
          enIdx = 1;
        }

        const out = [];
        for (let i = startIdx; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 2) continue;
          const kr = (row[krIdx] ?? "").toString().trim();
          const en = (row[enIdx] ?? "").toString().trim();
          if (!kr && !en) continue;
          out.push({ front: kr, back: en });
        }
        return out;
      }

      function newId() {
        return `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
      }

      // ---------- App ----------
      function App() {
        const [ready, setReady] = useState(false);
        const [connError, setConnError] = useState("");
        const [cards, setCards] = useState([]);
        const [direction, setDirection] = useState(() => localStorage.getItem("cd-direction") || "kr2en");
        const [view, setView] = useState("study");
        const [queue, setQueue] = useState([]);
        const [qIdx, setQIdx] = useState(0);
        const [flipped, setFlipped] = useState(false);
        const [toast, setToast] = useState("");
        const fileInputRef = useRef(null);

        const [importRows, setImportRows] = useState([]);
        const [importText, setImportText] = useState("");
        const [importError, setImportError] = useState("");

        const [newFront, setNewFront] = useState("");
        const [newBack, setNewBack] = useState("");
        const [search, setSearch] = useState("");

        useEffect(() => {
          if (!supabaseReady) {
            setConnError("Supabase 연결 정보가 설정되지 않았어요. index.html 상단의 SUPABASE_URL / SUPABASE_ANON_KEY를 채워주세요.");
            setReady(true);
            return;
          }
          (async () => {
            try {
              const data = await loadCardsRemote();
              setCards(data);
            } catch (e) {
              setConnError("데이터를 불러오지 못했어요: " + e.message);
            } finally {
              setReady(true);
            }
          })();
        }, []);

        useEffect(() => {
          localStorage.setItem("cd-direction", direction);
        }, [direction]);

        useEffect(() => {
          if (view !== "study") return;
          const due = cards.filter(isDue);
          due.sort((a, b) => (a.dueDate ? 1 : 0) - (b.dueDate ? 1 : 0));
          setQueue(due);
          setQIdx(0);
          setFlipped(false);
        }, [view, cards]);

        function showToast(msg) {
          setToast(msg);
          setTimeout(() => setToast(""), 1800);
        }

        async function handleRate(rating) {
          const card = queue[qIdx];
          if (!card) return;
          const updated = { ...card, ...nextSchedule(card, rating) };
          setCards((prev) => prev.map((c) => (c.id === card.id ? updated : c)));
          setFlipped(false);
          setQIdx((i) => i + 1);
          if (supabaseReady) await upsertCardRemote(updated);
        }

        async function handleFile(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          const text = await file.text();
          runImportPreview(text);
          e.target.value = "";
        }

        function runImportPreview(text) {
          setImportError("");
          try {
            const rows = parseCsvText(text);
            if (rows.length === 0) {
              setImportError("카드로 인식할 수 있는 행이 없어요. 형식을 확인해주세요.");
              setImportRows([]);
              return;
            }
            setImportRows(rows);
          } catch (err) {
            setImportError("파일을 읽는 중 문제가 생겼어요.");
            setImportRows([]);
          }
        }

        async function confirmImport() {
          const made = importRows.map((r) => ({ id: newId(), front: r.front, back: r.back, ...DEFAULT_CARD() }));
          setCards((prev) => [...prev, ...made]);
          showToast(`${made.length}장 추가됨`);
          setImportRows([]);
          setImportText("");
          setView("manage");
          if (supabaseReady) {
            for (const c of made) await upsertCardRemote(c);
          }
        }

        async function adManualCard() {
          if (!newFront.trim() || !newBack.trim()) return;
          const card = { id: newId(), front: newFront.trim(), back: newBack.trim(), ...DEFAULT_CARD() };
          setCards((prev) => [...prev, card]);
          setNewFront("");
          setNewBack("");
          showToast("카드 추가됨");
          if (supabaseReady) await upsertCardRemote(card);
        }

        async function deleteCard(id) {
          setCards((prev) => prev.filter((c) => c.id !== id));
          if (supabaseReady) await deleteCardRemote(id);
        }

        async function resetCard(id) {
          const reset = { ...DEFAULT_CARD() };
          setCards((prev) => prev.map((c) => (c.id === id ? { ...c, ...reset } : c)));
          if (supabaseReady) {
            const card = cards.find((c) => c.id === id);
            if (card) await upsertCardRemote({ ...card, ...reset });
          }
        }

        const dueCount = cards.filter(isDue).length;
        const current = queue[qIdx];
        const filteredCards = cards.filter(
          (c) => c.front.toLowerCase().includes(search.toLowerCase()) || c.back.toLowerCase().includes(search.toLowerCase())
        );
        const shownFront = current ? (direction === "kr2en" ? current.front : current.back) : "";
        const shownBack = current ? (direction === "kr2en" ? current.back : current.front) : "";

        if (!ready) {
          return <div className="min-h-screen bg-stone-900 text-stone-400 flex items-center justify-center text-sm">불러오는 중…</div>;
        }

        return (
          <div className="min-h-screen bg-stone-900 text-stone-100 flex flex-col font-sans">
            <div className="px-4 pt-5 pb-3 flex items-center justify-between border-b border-stone-700">
              <div>
                <p className="text-[11px] uppercase tracking-widest text-teal-400 font-mono">Card Drawer</p>
                <h1 className="text-lg font-serif text-stone-50">카드서랍</h1>
    </div>
              <button
                onClick={() => setDirection((d) => (d === "kr2en" ? "en2kr" : "kr2en"))}
                className="flex items-center gap-1 text-xs text-stone-300 border border-stone-600 rounded-full px-3 py-1.5 active:bg-stone-800"
              >
                ⇄ {direction === "kr2en" ? "한글 → 영어" : "영어 → 한글"}
    </button>
    </div>

            {connError && (
              <div className="mx-4 mt-3 text-xs text-amber-300 bg-amber-950/40 border border-amber-800 rounded-lg p-3">
                {connError}
    </div>
            )}

            <div className="flex-1 overflow-y-auto px-4 pb-28 pt-4">
              {view === "study" && (
                <StudyView
                  total={cards.length}
                  current={current}
                  qIdx={qIdx}
                  queueLen={queue.length}
                  flipped={flipped}
                  setFlipped={setFlipped}
                  shownFront={shownFront}
                  shownBack={shownBack}
                  handleRate={handleRate}
                  previewDays={previewDays}
                />
              )}

              {view === "import" && (
                <ImportView
                  fileInputRef={fileInputRef}
                  handleFile={handleFile}
                  importText={importText}
                  setImportText={setImportText}
                  runImportPreview={runImportPreview}
                  importRows={importRows}
                  importError={importError}
                  confirmImport={confirmImport}
                  setImportRows={setImportRows}
                />
              )}

              {view === "manage" && (
                <ManageView
                  cards={filteredCards}
                  search={search}
                  setSearch={setSearch}
                  newFront={newFront}
                  setNewFront={setNewFront}
                  newBack={newBack}
                  setNewBack={setNewBack}
                  addManualCard={addManualCard}
                  deleteCard={deleteCard}
                  resetCard={resetCard}
                />
              )}
    </div>

            {toast && (
              <div className="fixed top-16 left-1/2 -translate-x-1/2 bg-teal-600 text-white text-sm px-4 py-2 rounded-full shadow-lg">
                {toast}
    </div>
            )}

            <div className="fixed bottom-0 left-0 right-0 bg-stone-900 border-t border-stone-700 flex justify-around py-2 px-2">
              <NavBtn active={view === "study"} onClick={() => setView("study")} label="복습" emoji="📇" badge={dueCount} />
              <NavBtn active={view === "import"} onClick={() => setView("import")} label="가져오기" emoji="⬆️" />
              <NavBtn active={view === "manage"} onClick={() => setView("manage")} label="카드 관리" emoji="🗂️" badge={cards.length} />
    </div>
    </div>
        );
      }

      function NavBtn({ active, onClick, label, emoji, badge }) {
        return (
          <button onClick={onClick} className={`flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-xl relative ${active ? "text-teal-400" : "text-stone-400"}`}>
            <span className="text-base leading-none">{emoji}</span>
            <span className="text-[10px] font-mono">{label}</span>
            {!!badge && (
              <span className="absolute -top-1 right-1 bg-amber-500 text-stone-900 text-[9px] font-bold rounded-full min-w-[16px] h-4 flex items-center justify-center px-1">
                {badge}
    </span>
            )}
    </button>
        );
      }

      function StudyView({ total, current, qIdx, queueLen, flipped, setFlipped, shownFront, shownBack, handleRate, previewDays }) {
        if (total === 0) return <EmptyState title="카드가 없어요" desc="가져오기 탭에서 CSV 파일을 올리거나, 카드 관리에서 직접 추가해보세요." emoji="📇" />;
        if (!current) return <EmptyState title="오늘 복습 끝!" desc={`전체 ${total}장 중 오늘 할 카드는 모두 마쳤어요.`} emoji="✅" />;

        return (
          <div className="flex flex-col items-center">
            <div className="w-full flex items-center justify-between text-xs font-mono text-stone-400 mb-4">
              <span>{qIdx + 1} / {queueLen}</span>
              <span>오늘 남은 카드 {queueLen - qIdx - 1}</span>
    </div>

            <div onClick={() => setFlipped((f) => !f)} className="w-full max-w-sm aspect-[4/5] cursor-pointer" style={{ perspective: "1200px" }}>
              <div className="relative w-full h-full transition-transform duration-500" style={{ transformStyle: "preserve-3d", transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)" }}>
                <div className="absolute inset-0 rounded-2xl bg-amber-50 text-stone-900 border-2 border-amber-100 shadow-2xl flex flex-col p-6" style={{ backfaceVisibility: "hidden" }}>
                  <div className="w-3 h-3 rounded-full bg-stone-300 mx-auto mb-6" />
                  <div className="flex-1 flex items-center justify-center text-center">
                    <p className="font-serif text-2xl leading-snug">{shownFront}</p>
    </div>
                  <p className="text-center text-[11px] font-mono text-stone-400 tracking-widest">탭해서 뒤집기</p>
    </div>
                <div className="absolute inset-0 rounded-2xl bg-stone-50 text-stone-900 border-2 border-stone-200 shadow-2xl flex flex-col p-6" style={{ backfaceVisibility: "hidden", transform: "rotateY(180deg)" }}>
                  <div className="w-3 h-3 rounded-full bg-teal-300 mx-auto mb-6" />
                  <div className="flex-1 flex items-center justify-center text-center">
                    <p className="font-serif text-xl leading-snug">{shownBack}</p>
    </div>
                  <p className="text-center text-[11px] font-mono text-stone-400 tracking-widest">얼마나 잘 기억했나요?</p>
    </div>
    </div>
    </div>

            {!flipped ? (
              <button onClick={() => setFlipped(true)} className="mt-6 w-full max-w-sm bg-teal-600 text-white rounded-xl py-3 font-medium active:bg-teal-700">
                정답 보기
    </button>
            ) : (
              <div className="mt-6 w-full max-w-sm grid grid-cols-4 gap-2">
                <RateBtn label="다시" days={previewDays(current, "again")} color="bg-rose-500" onClick={() => handleRate("again")} />
                <RateBtn label="어려움" days={previewDays(current, "hard")} color="bg-amber-500" onClick={() => handleRate("hard")} />
                <RateBtn label="좋음" days={previewDays(current, "good")} color="bg-teal-500" onClick={() => handleRate("good")} />
                <RateBtn label="쉬움" days={previewDays(current, "easy")} color="bg-sky-500" onClick={() => handleRate("easy")} />
    </div>
            )}
    </div>
        );
      }

      function RateBtn({ label, days, color, onClick }) {
        return (
          <button onClick={onClick} className={`${color} rounded-xl py-2.5 flex flex-col items-center text-white active:opacity-80`}>
            <span className="text-xs font-semibold">{label}</span>
            <span className="text-[10px] font-mono opacity-90">{days}일</span>
    </button>
        );
      }

      function EmptyState({ title, desc, emoji }) {
        return (
          <div className="flex flex-col items-center justify-center text-center mt-20 gap-3">
            <div className="w-14 h-14 rounded-full bg-stone-800 flex items-center justify-center text-2xl">{emoji}</div>
            <p className="font-serif text-lg">{title}</p>
            <p className="text-sm text-stone-400 max-w-xs">{desc}</p>
    </div>
        );
      }

      function ImportView({ fileInputRef, handleFile, importText, setImportText, runImportPreview, importRows, importError, confirmImport, setImportRows }) {
        return (
          <div className="flex flex-col gap-4">
            <div>
              <p className="font-serif text-lg mb-1">CSV로 카드 만들기</p>
              <p className="text-xs text-stone-400 leading-relaxed">
                <span className="font-mono text-stone-300">한글해석, 영어문장</span> 2열 CSV를 올리면 한글해석은 앞면, 영어문장은 뒷면 카드로 자동 변환돼요.
    </p>
    </div>

            <button onClick={() => fileInputRef.current?.click()} className="w-full border-2 border-dashed border-stone-600 rounded-2xl py-8 flex flex-col items-center gap-2 text-stone-300 active:bg-stone-800">
              <span className="text-xl">⬆️</span>
              <span className="text-sm">CSV 파일 선택</span>
              <span className="text-[11px] text-stone-500">.csv 파일</span>
    </button>
            <input ref={fileInputRef} type="file" accept=".csv,text/csv" className="hidden" onChange={handleFile} />

            <div className="flex items-center gap-2 text-stone-500 text-xs">
              <div className="flex-1 h-px bg-stone-700" />또는 붙여넣기<div className="flex-1 h-px bg-stone-700" />
    </div>

            <textarea
              value={importText}
              onChange={(e) => setImportText(e.target.value)}
              placeholder={"한글해석,영어문장\n저는 학생입니다,I am a student.\n오늘 날씨가 좋아요,The weather is nice today."}
              className="w-full h-28 bg-stone-800 border border-stone-600 rounded-xl p-3 text-xs font-mono text-stone-200 placeholder-stone-500"
            />
            <button onClick={() => runImportPreview(importText)} disabled={!importText.trim()} className="bg-stone-700 text-stone-100 rounded-xl py-2.5 text-sm disabled:opacity-40">
              미리보기 만들기
    </button>

            {importError && <p className="text-rose-400 text-xs bg-rose-950/40 border border-rose-900 rounded-lg p-3">{importError}</p>}

            {importRows.length > 0 && (
              <div className="border border-stone-700 rounded-xl overflow-hidden">
                <div className="bg-stone-800 px-3 py-2 flex items-center justify-between">
                  <p className="text-xs font-mono text-teal-400">{importRows.length}장 인식됨</p>
                  <button onClick={() => setImportRows([])} className="text-stone-400">✕</button>
    </div>
                <div className="max-h-56 overflow-y-auto divide-y divide-stone-800">
                  {importRows.slice(0, 20).map((r, i) => (
                    <div key={i} className="px-3 py-2 text-xs">
                      <p className="text-stone-200">{r.front}</p>
                      <p className="text-stone-500">{r.back}</p>
    </div>
                  ))}
                  {importRows.length > 20 && <p className="px-3 py-2 text-[11px] text-stone-500">외 {importRows.length - 20}장 더...</p>}
    </div>
                <button onClick={confirmImport} className="w-full bg-teal-600 text-white py-3 text-sm font-medium active:bg-teal-700">
                  {importRows.length}장 카드로 추가하기
    </button>
    </div>
            )}
    </div>
        );
      }

      function ManageView({ cards, search, setSearch, newFront, setNewFront, newBack, setNewBack, addManualCard, deleteCard, resetCard }) {
        return (
          <div className="flex flex-col gap-4">
            <div>
              <p className="font-serif text-lg mb-2">카드 직접 추가</p>
              <div className="flex flex-col gap-2 bg-stone-800 border border-stone-700 rounded-xl p-3">
                <input value={newFront} onChange={(e) => setNewFront(e.target.value)} placeholder="한글 해석" className="bg-stone-900 border border-stone-700 rounded-lg px-3 py-2 text-sm placeholder-stone-500" />
                <input value={newBack} onChange={(e) => setNewBack(e.target.value)} placeholder="영어 문장" className="bg-stone-900 border border-stone-700 rounded-lg px-3 py-2 text-sm placeholder-stone-500" />
                <button onClick={addManualCard} className="flex items-center justify-center gap-1 bg-teal-600 text-white rounded-lg py-2 text-sm active:bg-teal-700">＋ 추가</button>
    </div>
    </div>

            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="카드 검색" className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-2 text-sm placeholder-stone-500" />

            <div className="flex flex-col gap-2">
              {cards.length === 0 && <p className="text-sm text-stone-500 text-center mt-6">표시할 카드가 없어요.</p>}
              {cards.map((c) => (
                <div key={c.id} className="bg-stone-800 border border-stone-700 rounded-xl p-3 flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p className="text-sm text-stone-100 truncate">{c.front}</p>
                    <p className="text-xs text-stone-400 truncate">{c.back}</p>
                    <p className="text-[10px] font-mono text-stone-500 mt-1">{c.repetitions === 0 ? "새 카드" : `간격 ${c.interval}일 · 복습 ${c.repetitions}회`}</p>
    </div>
                  <div className="flex gap-1 shrink-0">
                    <button onClick={() => resetCard(c.id)} className="p-2 text-stone-400 active:text-teal-400" title="복습 기록 초기화">↺</button>
                    <button onClick={() => deleteCard(c.id)} className="p-2 text-stone-400 active:text-rose-400" title="삭제">🗑️</button>
    </div>
    </div>
              ))}
    </div>
    </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <script>
        // 위 app-source를 classic 런타임(React.createElement)으로 직접 컴파일해서 실행.
        // (import 구문이 들어간 automatic 런타임 출력을 피하기 위해 수동으로 처리함)
        (function () {
              const source = document.getElementById("app-source").textContent;
              const output = Babel.transform(source, {
                      presets: [["react", { runtime: "classic" }]],
              }).code;
              const script = document.createElement("script");
              script.textContent = output;
              document.body.appendChild(script);
        })();
    </script>

    <script>
        // 예전 버전에 등록됐던 서비스워커/캐시를 자동으로 정리 (캐시된 옛날 화면이 계속 보이는 문제 방지)
        if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then((regs) => {
                      regs.forEach((reg) => reg.unregister());
              });
        }
            if (window.caches) {
                  caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
            }
              </script>
  </body>
</html>
